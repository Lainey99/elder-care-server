        /* 地图页样式 */

        #events-container { display: none; }

        #detail-container { display: none; }
        #detail-container.active {
            display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
            align-items: stretch; justify-content: flex-end;
        }

        .map-layout { display: flex; flex-direction: column; gap: 12px; }
        .map-wrap { position: relative; height: clamp(280px, 45vh, 380px); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); min-width: 0; }
        #map { width: 100%; height: 100%; }

        /* 移动端：地图占满剩余空间，设备列表浮动可收起 */
        @media (max-width: 899px) {
            #map-container.active { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; z-index: 50; padding: 0 !important; }
            #map-container.active .container { padding: 0 !important; max-width: 100% !important; }
            .map-layout {
                display: block; position: relative;
                width: 100%; height: 100vh; height: 100dvh;
            }
            .map-wrap {
                width: 100%; height: 100%;

            }

<body>
    <div class="tab-bar" id="tab-bar">
        <div class="tab active" onclick="switchTab('list')">📋 设备列表</div>
        <div class="tab" onclick="switchTab('history')">📜 上报记录</div>
        <div class="tab" onclick="switchTab('events')">📌 事件记录</div>
        <div class="tab" onclick="switchTab('map')">🗺️ 设备地图</div>
    </div>

    <div id="list-container" class="active">
        <div class="container" id="app">
            <div class="loading"><div class="spinner"></div><div style="margin-top:12px">加载中...</div></div>
        </div>
    </div>

    <div id="history-container">
        <div class="container" id="history-app">
            <div class="loading"><div class="spinner"></div><div style="margin-top:12px">加载中...</div></div>
        </div>
    </div>

    <div id="events-container">
        <div class="container" id="events-app">
            <div class="loading"><div class="spinner"></div><div style="margin-top:12px">加载中...</div></div>
        </div>
    </div>

    <div id="map-container">
        <div class="container" style="padding:16px;max-width:1400px;">
            <div class="map-layout">
                <div id="map-location-list" class="map-location-list">
                    <div class="map-location-empty">正在加载设备位置...</div>
                </div>
                <div class="map-wrap">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="map-list-toggle" id="map-list-toggle" onclick="toggleMapList()" title="设备列表">📋</button>

    <div id="detail-container">
        <div class="detail-overlay" onclick="handleDetailOverlayClick()"></div>
        <div class="detail-drawer">
            <div class="detail-close">
                <button class="detail-close-btn" onclick="goBack()" title="关闭">✕</button>
            </div>
            <div id="detail-app"></div>
        </div>
    </div>

    <button id="refresh-btn" onclick="refresh()" title="刷新">🔄</button>

    <script>
    const API = window.location.origin + '/api';
    let currentView = 'list';
    let currentDeviceId = null;
    let currentTab = 'list';
    let map = null;
    let markers = [];
    let currentMapPoints = [];
    let activeMapDeviceId = null;
    let mapInfoWindow = null;
    let geocoderInstance = null;
    let mapRenderVersion = 0;
    let mapInitSequenceId = 0;
    let mapControlsReady = false;
        let currentHeartbeatDetail = null;
        let historyRenderVersion = 0;
        let eventsRenderVersion = 0;
        let detailOpenedAt = 0;
    const mapPointLookup = new Map();
    const locationTextCache = new Map();
        const historyState = {
            start: null,
            end: null,
            deviceId: '',
            preset: '24h',
            chart: null,
            records: [],
            devices: []
        };
        const eventsState = {
            deviceId: '',
            devices: [],
            events: []
        };

    async function fetchJSON(url) { const res = await fetch(url); return res.json(); }

    function formatTime(iso) {
        if (!iso) return '未知';
        const diff = Date.now() - new Date(iso).getTime();

    }
    function parseDateTimeLocalInput(value) {

    function formatGap(ms) {
        if (!Number.isFinite(ms) || ms <= 0) return '首条上报';
        const totalMinutes = Math.round(ms / 60000);
        if (totalMinutes < 60) return `${totalMinutes} 分钟`;
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return minutes ? `${hours} 小时 ${minutes} 分钟` : `${hours} 小时`;

    function historyDisplayName(record) {

    function getHistoryChartHeight(deviceCount) {

        return Math.max(440, Math.min(900, 180 + count * 42));
    }
    function getHistoryPresetDefault() {

    function getHistoryPresetRange(preset) {
        const now = new Date();
        const start = new Date(now.getTime());
        const hoursMap = { '1h': 1, '6h': 6, '24h': 24, '3d': 72, '7d': 168 };
        const hours = hoursMap[preset] || 24;
        start.setHours(start.getHours() - hours);
        return { start, end: now };
    }
    function ensureHistoryDefaults() {

    function getCoordinateKey(lat, lng) { return `${lat.toFixed(5)},${lng.toFixed(5)}`; }
    function isOverseasCoordinate(lat, lng) {

    async function waitForMapContainerReady(maxAttempts) {

            await nextPaint();
            if (currentTab !== 'map' || currentView === 'detail') return false;

    function triggerMapInitSequence() {

    function getGeocoder() {
        if (geocoderInstance) return Promise.resolve(geocoderInstance);
        return new Promise(function(resolve) {
            AMap.plugin('AMap.Geocoder', function() {
                geocoderInstance = new AMap.Geocoder({ radius: 1000, extensions: 'base' });
                resolve(geocoderInstance);
            });
        });
    }
    function formatApproxLocation(regeocode) {
        if (!regeocode) return '位置解析失败';
        const comp = regeocode.addressComponent || {};
        const streetNumber = comp.streetNumber || {};
        const landmark = [streetNumber.street, streetNumber.number].filter(Boolean).join('');
        const prefix = [comp.city && comp.city !== comp.province ? comp.city : '', comp.district, comp.township].filter(Boolean).join('');
        return landmark ? `${prefix}${landmark}` : (regeocode.formattedAddress || prefix || '位置解析失败');
    }
    async function reverseGeocode(lat, lng) {
        const key = getCoordinateKey(lat, lng);
        if (locationTextCache.has(key)) return locationTextCache.get(key);
        if (isOverseasCoordinate(lat, lng)) {
            const text = '海外位置，暂不支持高德解析';
            locationTextCache.set(key, text);
            return text;
        }
        try {
            const geocoder = await getGeocoder();
            const text = await new Promise(function(resolve) {
                geocoder.getAddress([lng, lat], function(status, result) {
                    if (status === 'complete' && result && result.regeocode) resolve(formatApproxLocation(result.regeocode));
                    else resolve('位置解析失败');
                });
            });
            locationTextCache.set(key, text);
            return text;
        } catch (e) {
            return '位置解析失败';
        }
    }
    function renderMapLocationList(points) {

        container.innerHTML = points.map(function(point) {
            const isActive = activeMapDeviceId === point.device.deviceId ? ' active' : '';
            const locationText = point.locationText || '正在解析位置...';
            return `<button type="button" class="map-location-item${isActive}" data-device-id="${escapeHTML(point.device.deviceId)}" onclick="focusMapDevice(this.dataset.deviceId)">
                <span class="map-location-name">${escapeHTML(point.device.elderName || point.device.deviceId)}</span>

    // WGS-84 → GCJ-02 坐标转换（高德地图专用，JSAPI 2.0）
    function convertToGCJ02(points) {
        return new Promise(function(resolve, reject) {
            if (!points.length) return resolve(points);
            var coords = [];
            for (var i = 0; i < points.length; i++) {
                coords.push([points[i].longitude, points[i].latitude]);
            }
            AMap.convertFrom(coords, 'gps', function(status, result) {
                if (status === 'complete' && result && result.locations) {
                    for (var i = 0; i < result.locations.length; i++) {
                        var loc = result.locations[i];
                        // 高德 2.0 返回 LngLat 对象，兼容 .lng/.lat 和 getLng()/getLat()
                        points[i].longitude = loc.lng !== undefined ? loc.lng : loc.getLng();
                        points[i].latitude = loc.lat !== undefined ? loc.lat : loc.getLat();
                    }
                }
                resolve(points);
            });
        });
    }

    async function initMap() {
        const isReady = await waitForMapContainerReady();
        if (!isReady) return;
        const version = ++mapRenderVersion;
        document.getElementById('map-location-list').innerHTML = '<div class="map-location-empty">正在加载设备位置...</div>';
        const devices = await fetchJSON(`${API}/devices`);
        const detailedDevices = await Promise.all(devices.map(async function(device) {
            const detail = await fetchJSON(`${API}/device/${device.deviceId}/latest`);
            return { device, detail };
        }));
        if (version !== mapRenderVersion) return;

        let points = detailedDevices.filter(function(item) {
            return hasValidCoordinates(item.detail);
        }).map(function(item) {
            return {
                device: item.device,
                detail: item.detail,
                latitude: Number(item.detail.latitude),
                longitude: Number(item.detail.longitude),
                locationText: ''
            };
        });

        // WGS-84 → GCJ-02 转换
        points = await convertToGCJ02(points);

        // 填充缓存
        points.forEach(function(p) {
            var key = getCoordinateKey(p.latitude, p.longitude);
            p.locationText = locationTextCache.get(key) || '';
        });

        if (points.length === 0) {
            currentMapPoints = [];
            activeMapDeviceId = null;
            mapPointLookup.clear();
            markers.forEach(function(m) { map && map.remove(m); });
            markers = [];
            if (mapInfoWindow) mapInfoWindow.close();
            renderMapLocationList([]);
            if (!map) {
                map = new AMap.Map('map', { zoom: 5, center: [116.4074, 39.9042], resizeEnable: true });
                ensureMapControls();
            } else {
                map.setZoomAndCenter(5, [116.4074, 39.9042]);
                ensureMapControls();
            }
            fitMapToMarkers();
            return;
        }

        // 首次创建地图
        if (!map) {
            map = new AMap.Map('map', {
                zoom: 14,
                center: [points[0].longitude, points[0].latitude],
                resizeEnable: true,
                zooms: [3, 20]
            });
        }
        ensureMapControls();

        // 清除旧标记
        markers.forEach(function(m) { map.remove(m); });
        markers = [];
        mapPointLookup.clear();

        // 添加标记
        for (var i = 0; i < points.length; i++) {
            (function(p) {
                var color = p.device.isOnline ? '#4CAF50' : '#f44336';
                var marker = new AMap.Marker({
                    position: new AMap.LngLat(p.longitude, p.latitude),
                    map: map,
                    title: p.device.elderName,
                    content: '<div style="width:32px;height:32px;background:' + color + ';border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;">📱</div>',
                    offset: new AMap.Pixel(-16, -16)
                });

                var infoContent = '<div style="padding:8px;font-family:sans-serif;min-width:150px;">' +
                    '<b>' + escapeHTML(p.device.elderName || p.device.deviceId) + '</b><br>' +
                    '位置: ' + escapeHTML(p.locationText || '正在解析位置...') + '<br>' +
                    '电量: ' + p.detail.batteryPercent + '%<br>' +
                    '网络: ' + p.detail.networkStatus + '<br>' +
                    '最后上报: ' + formatTime(p.device.lastOnline) + '</div>';
                p.infoContent = infoContent;
                p.marker = marker;
                mapPointLookup.set(p.device.deviceId, p);

                marker.on('click', function() {
                    activeMapDeviceId = p.device.deviceId;
                    renderMapLocationList(currentMapPoints);
                    openMapInfoWindow(p);
                });

                marker.on('dblclick', function() {
                    focusMapDevice(p.device.deviceId);
                });

                markers.push(marker);
            })(points[i]);
        }

        currentMapPoints = points;
        if (activeMapDeviceId && !mapPointLookup.has(activeMapDeviceId)) activeMapDeviceId = null;
        renderMapLocationList(currentMapPoints);
        fitMapToMarkers();

        for (const point of currentMapPoints) {
            if (point.locationText) continue;
            reverseGeocode(point.latitude, point.longitude).then(function(locationText) {
                if (version !== mapRenderVersion) return;
                point.locationText = locationText;
                point.infoContent = '<div style="padding:8px;font-family:sans-serif;min-width:150px;">' +
                    '<b>' + escapeHTML(point.device.elderName || point.device.deviceId) + '</b><br>' +
                    '位置: ' + escapeHTML(point.locationText || '位置解析失败') + '<br>' +
                    '电量: ' + point.detail.batteryPercent + '%<br>' +
                    '网络: ' + point.detail.networkStatus + '<br>' +
                    '最后上报: ' + formatTime(point.device.lastOnline) + '</div>';
                renderMapLocationList(currentMapPoints);
                if (activeMapDeviceId === point.device.deviceId) openMapInfoWindow(point);
            });
        }
    }

    function buildHistoryPointMap(records) {
        const grouped = new Map();
        for (const record of records) {
            if (!grouped.has(record.deviceId)) grouped.set(record.deviceId, []);
            grouped.get(record.deviceId).push(record);
        }

        const categoryMeta = [];
        const points = [];

        const deviceEntries = Array.from(grouped.entries()).sort(function(a, b) {
            return historyDisplayName(a[1][0]).localeCompare(historyDisplayName(b[1][0]), 'zh-CN');
        });

        for (const entry of deviceEntries) {
            const deviceId = entry[0];
            const items = entry[1].slice().sort(function(a, b) {
                return new Date(a.serverReceiveTime || a.serverTime).getTime() - new Date(b.serverReceiveTime || b.serverTime).getTime();
            });
            const displayName = historyDisplayName(items[0]);
            const axisKey = `${displayName}__${deviceId}`;
            categoryMeta.push({ key: axisKey, name: displayName, deviceId });

            let previousRecord = null;
            for (const item of items) {
                const serverReceiveTime = item.serverReceiveTime || item.serverTime;
                if (!serverReceiveTime) continue;
                const previousTime = previousRecord ? new Date(previousRecord.serverReceiveTime || previousRecord.serverTime).getTime() : null;
                const currentTime = new Date(serverReceiveTime).getTime();
                points.push({
                    value: [currentTime, axisKey],
                    heartbeat: item,
                    previousHeartbeat: previousRecord,
                    gapMs: previousTime ? currentTime - previousTime : null
                });
                previousRecord = item;
            }
        }

        return { categoryMeta, points };
    }
    function updateHistorySummary(records, categoryMeta) {
        const summary = document.getElementById('history-summary');
        if (!summary) return;
        const rangeText = historyState.start && historyState.end ? `${fmt(historyState.start.toISOString())} - ${fmt(historyState.end.toISOString())}` : '未设置时间范围';
        summary.innerHTML = `
            <span class="history-summary-chip">设备数 ${categoryMeta.length}</span>
            <span class="history-summary-chip">心跳数 ${records.length}</span>
            <span class="history-summary-chip">${historyState.deviceId ? '单设备视图' : '全部设备视图'}</span>
            <span class="history-summary-chip">${escapeHTML(rangeText)}</span>
        `;
    }
    function buildHistoryChartOption(records) {
        const built = buildHistoryPointMap(records);
        const categoryMeta = built.categoryMeta;
        const points = built.points;

                    axisLabel: {
                        color: '#555',
                        fontSize: compact ? 10 : 12,
                        formatter: function(value) {
                            return truncateText(labelMap[value] || value, compact ? 7 : 12);

                    },
                    axisLine: { lineStyle: { color: '#ddd' } },
                    axisTick: { show: false }
                },
                dataZoom: [
                    { type: 'inside', xAxisIndex: 0, filterMode: 'none' },
                    { type: 'slider', xAxisIndex: 0, height: compact ? 18 : 24, bottom: compact ? 18 : 20, filterMode: 'none', handleSize: compact ? '90%' : '100%' }
                ],
                series: [{
                    type: 'scatter',
                    data: points,
                    symbolSize: compact ? (historyState.deviceId ? 18 : 14) : (historyState.deviceId ? 14 : 10),
                    itemStyle: {
                        color: function(params) {
                            const heartbeat = params.data.heartbeat;
                            if (heartbeat.networkStatus === 'NONE') return '#f44336';
                            if (heartbeat.batteryPercent <= 20) return '#FF9800';
                            return '#667eea';

                    emphasis: {
                        itemStyle: { borderColor: '#fff', borderWidth: 2, shadowBlur: 12, shadowColor: 'rgba(102,126,234,0.35)' }

    }
    function renderHistoryEmptyState() {
        const chartEl = document.getElementById('history-chart');
        if (!chartEl) return;
        chartEl.innerHTML = `<div class="history-empty-panel">
            <div class="empty-icon">📭</div>
            <div class="empty-text">当前筛选范围内暂无心跳数据</div>
            <div class="empty-hint">可以切换时间范围或选择其他设备继续查看。</div>
        </div>`;
    }
    function renderHistoryChart(records) {
        disposeHistoryChart();
        const pointMap = buildHistoryPointMap(records);
        updateHistorySummary(records, pointMap.categoryMeta);
        if (!records.length) {
            renderHistoryEmptyState();
            return;
        }
        if (!window.echarts) {
            renderHistoryEmptyState();
            const chartEl = document.getElementById('history-chart');
            if (chartEl) chartEl.innerHTML = '<div class="history-empty-panel"><div class="empty-icon">⚠️</div><div class="empty-text">图表库加载失败</div><div class="empty-hint">请稍后刷新页面重试。</div></div>';
            return;
        }
        const chartEl = document.getElementById('history-chart');
        chartEl.style.height = getHistoryChartHeight(pointMap.categoryMeta.length) + 'px';
        const built = buildHistoryChartOption(records);
        updateHistorySummary(records, built.categoryMeta);
        historyState.chart = echarts.init(chartEl);
        historyState.chart.setOption(built.option);
        historyState.chart.on('click', function(params) {
            if (!params.data || !params.data.heartbeat) return;
            showHeartbeatDetail(params.data.heartbeat, params.data.previousHeartbeat);
        });
    }
    async function refreshHistoryData() {
        await renderHistory();
    }
    function setHistoryPreset(preset) {
        const range = getHistoryPresetRange(preset);
        historyState.start = range.start;
        historyState.end = range.end;
        historyState.preset = preset;
        renderHistory();
    }
    function onHistoryCustomRangeChange() {
        const startInput = document.getElementById('history-start');
        const endInput = document.getElementById('history-end');
        const start = parseDateTimeLocalInput(startInput && startInput.value);
        const end = parseDateTimeLocalInput(endInput && endInput.value);
        if (!start || !end || start > end) {
            alert('请选择有效的开始和结束时间');
            renderHistory();
            return;
        }
        historyState.start = start;
        historyState.end = end;
        historyState.preset = 'custom';
        renderHistory();
    }
    function onHistoryDeviceChange() {
        const select = document.getElementById('history-device');
        historyState.deviceId = select ? select.value : '';
        renderHistory();
    }
    async function renderHistory() {
        const app = document.getElementById('history-app');
        ensureHistoryDefaults();
        disposeHistoryChart();
        app.innerHTML = '<div class="loading"><div class="spinner"></div><div style="margin-top:12px">正在加载心跳时序图...</div></div>';

        const renderVersion = ++historyRenderVersion;
        const query = getHistoryQueryString();

        try {
            const responses = await Promise.all([
                fetchJSON(`${API}/devices`),
                fetchJSON(`${API}/heartbeats?${query}`)
            ]);
            if (renderVersion !== historyRenderVersion) return;

            historyState.devices = responses[0] || [];
            historyState.records = responses[1] || [];
            renderHistoryShell();
            renderHistoryChart(historyState.records);
        } catch (e) {
            if (renderVersion !== historyRenderVersion) return;
            app.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">加载上报记录失败</div><div class="empty-hint">请稍后刷新重试</div></div>';
        }
    }

    // ============ 事件记录 ============

        const app = document.getElementById('events-app');
        const selectedDevice = eventsState.devices.find(function(device) { return device.deviceId === eventsState.deviceId; });

        const timelineHTML = eventsState.events.length ? `<div class="timeline">

    function selectEventsDevice(deviceId) {
        if (!deviceId || deviceId === eventsState.deviceId) return;
        renderEvents(deviceId);
    }
    async function renderEvents(nextDeviceId) {
        const app = document.getElementById('events-app');
        app.innerHTML = '<div class="loading"><div class="spinner"></div><div style="margin-top:12px">正在加载事件记录...</div></div>';

        const renderVersion = ++eventsRenderVersion;

        try {
            const devices = await fetchJSON(`${API}/devices`);
            if (renderVersion !== eventsRenderVersion) return;
            if (!devices.length) {
                eventsState.deviceId = '';
                eventsState.devices = [];
                eventsState.events = [];
                app.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">暂无设备数据</div><div class="empty-hint">设备上报后即可查看事件记录。</div></div>';
                return;
            }

            const preferredDeviceId = nextDeviceId || eventsState.deviceId;
            const selectedDevice = devices.find(function(device) { return device.deviceId === preferredDeviceId; }) || devices[0];
            const events = await fetchJSON(`${API}/device/${selectedDevice.deviceId}/events?limit=50`);
            if (renderVersion !== eventsRenderVersion) return;

            eventsState.deviceId = selectedDevice.deviceId;
            eventsState.devices = devices;
            eventsState.events = events || [];
            renderEventsShell();
        } catch (e) {
            if (renderVersion !== eventsRenderVersion) return;
            app.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-text">加载事件记录失败</div><div class="empty-hint">请稍后刷新重试。</div></div>';
        }
    }

        else {
            html += '<div class="timeline">';
            for (const e of events) html += `<div class="timeline-item"><div class="timeline-dot"><span class="icon">${evtIcon(e.eventType)}</span></div><div class="timeline-content"><div class="timeline-title">${e.eventType}</div><div class="timeline-time">${fmt(e.eventTime||e.serverReceiveTime)}</div>${e.oldValue||e.newValue?`<div class="timeline-detail">${e.oldValue?'旧值: '+e.oldValue:''} ${e.newValue?'新值: '+e.newValue:''}</div>`:''}</div></div>`;
            html += '</div>';
        }
        html += '</div>';

        html += `<button class="detail-delete-btn" onclick="deleteDevice('${data.deviceId}','${escapeHTML(data.elderName || data.deviceId)}')">🗑️ 删除设备及所有记录</button>`;

        document.getElementById('detail-app').innerHTML = html;
        window.scrollTo(0, 0);
    }
    function showHeartbeatDetail(heartbeat, previousHeartbeat) {
        currentView = 'detail';
        currentDeviceId = null;
        currentHeartbeatDetail = { heartbeat, previousHeartbeat };
        detailOpenedAt = Date.now();
        document.getElementById('list-container').classList.remove('active');
        document.getElementById('map-container').classList.remove('active');
        document.getElementById('history-container').classList.remove('active');
        document.getElementById('detail-container').classList.add('active');

        const serverTime = heartbeat.serverReceiveTime || heartbeat.serverTime;
        const gapMs = previousHeartbeat ? (new Date(serverTime).getTime() - new Date(previousHeartbeat.serverReceiveTime || previousHeartbeat.serverTime).getTime()) : null;
        const name = historyDisplayName(heartbeat);

        let html = `<div class="detail-section"><div class="section-title">📜 心跳详情</div><div class="section-body">
            <div class="detail-row"><span class="detail-label">设备</span><span class="detail-value">${escapeHTML(name)}</span></div>
            <div class="detail-row"><span class="detail-label">设备ID</span><span class="detail-value" style="font-size:12px;color:#999">${escapeHTML(heartbeat.deviceId || '未知')}</span></div>
            <div class="detail-row"><span class="detail-label">服务端接收时间</span><span class="detail-value">${fmt(serverTime)}</span></div>
            <div class="detail-row"><span class="detail-label">客户端上报时间</span><span class="detail-value">${fmt(heartbeat.clientReportTime)}</span></div>
            <div class="detail-row"><span class="detail-label">与上一条间隔</span><span class="detail-value">${formatGap(gapMs)}</span></div>
        </div></div>`;

        html += '<div class="detail-columns" style="margin-top:12px">';
        html += `<div class="detail-section"><div class="section-title">🔋 电量信息</div><div class="section-body">
            <div class="detail-row"><span class="detail-label">当前电量</span><span class="detail-value" style="color:${batColor(Number(heartbeat.batteryPercent) || 0)};font-size:18px;font-weight:700">${maybeValue(heartbeat.batteryPercent)}%</span></div>
            <div class="detail-row"><span class="detail-label"></span><span class="detail-value" style="width:100%"><div class="battery-bar" style="height:10px"><div class="battery-fill ${batClass(Number(heartbeat.batteryPercent) || 0)}" style="width:${Math.max(0, Math.min(100, Number(heartbeat.batteryPercent) || 0))}%"></div></div></span></div>
            <div class="detail-row"><span class="detail-label">充电状态</span><span class="detail-value">${heartbeat.isCharging ? '⚡ 充电中' : '未充电'}</span></div>
            <div class="detail-row"><span class="detail-label">省电模式</span><span class="detail-value">${dot(!heartbeat.powerSaveMode)} ${heartbeat.powerSaveMode ? '已开启' : '未开启'}</span></div>
        </div></div>`;

        html += `<div class="detail-section"><div class="section-title">📶 网络状态</div><div class="section-body">
            <div class="detail-row"><span class="detail-label">网络连接</span><span class="detail-value">${dot(heartbeat.networkStatus !== 'NONE')} ${maybeValue(heartbeat.networkStatus)}</span></div>
            <div class="detail-row"><span class="detail-label">WiFi开关</span><span class="detail-value">${dot(heartbeat.wifiEnabled)} ${heartbeat.wifiEnabled ? '已开启' : '已关闭'}</span></div>
            <div class="detail-row"><span class="detail-label">WiFi连接</span><span class="detail-value">${dot(heartbeat.wifiConnected)} ${heartbeat.wifiConnected ? '已连接' : '未连接'}</span></div>
            <div class="detail-row"><span class="detail-label">WiFi名称</span><span class="detail-value">${escapeHTML(String(maybeValue(heartbeat.wifiSsid)))}</span></div>
            <div class="detail-row"><span class="detail-label">蜂窝数据</span><span class="detail-value">${dot(heartbeat.mobileDataEnabled)} ${heartbeat.mobileDataEnabled ? '已开启' : '已关闭'}</span></div>
            <div class="detail-row"><span class="detail-label">飞行模式</span><span class="detail-value">${dot(!heartbeat.airplaneMode)} ${heartbeat.airplaneMode ? '✈️ 已开启' : '未开启'}</span></div>
        </div></div>`;

        html += `<div class="detail-section"><div class="section-title">🔔 音量设置</div><div class="section-body">
            <div class="detail-row"><span class="detail-label">铃声音量</span><span class="detail-value">${volumeBar(heartbeat.ringVolume, heartbeat.ringVolumeMax)} ${maybeValue(heartbeat.ringVolume, 0)}/${maybeValue(heartbeat.ringVolumeMax, 0)}</span></div>
            <div class="detail-row"><span class="detail-label">媒体音量</span><span class="detail-value">${volumeBar(heartbeat.mediaVolume, heartbeat.mediaVolumeMax)} ${maybeValue(heartbeat.mediaVolume, 0)}/${maybeValue(heartbeat.mediaVolumeMax, 0)}</span></div>
            <div class="detail-row"><span class="detail-label">响铃模式</span><span class="detail-value">${dot(heartbeat.ringerMode === 'NORMAL')} ${heartbeat.ringerMode === 'NORMAL' ? '正常' : heartbeat.ringerMode === 'VIBRATE' ? '振动' : heartbeat.ringerMode === 'SILENT' ? '静音' : '未知'}</span></div>
            <div class="detail-row"><span class="detail-label">勿扰模式</span><span class="detail-value">${dot(heartbeat.zenMode === 'OFF')} ${maybeValue(heartbeat.zenMode)}</span></div>
        </div></div>`;

        html += `<div class="detail-section"><div class="section-title">📍 位置信息</div><div class="section-body">
            <div class="detail-row"><span class="detail-label">纬度</span><span class="detail-value">${maybeValue(heartbeat.latitude, '未获取')}</span></div>
            <div class="detail-row"><span class="detail-label">经度</span><span class="detail-value">${maybeValue(heartbeat.longitude, '未获取')}</span></div>
            <div class="detail-row"><span class="detail-label">精度</span><span class="detail-value">${heartbeat.accuracy ? heartbeat.accuracy + ' 米' : '未知'}</span></div>
            <div class="detail-row"><span class="detail-label">定位时间</span><span class="detail-value">${heartbeat.locationTime ? fmt(heartbeat.locationTime) : '未知'}</span></div>
            <div class="detail-row"><span class="detail-label">定位来源</span><span class="detail-value">${maybeValue(heartbeat.locationProvider)}</span></div>
        </div></div>`;

        html += `<div class="detail-section"><div class="section-title">⚙️ 权限与服务</div><div class="section-body">
            <div class="detail-row"><span class="detail-label">定位权限</span><span class="detail-value">${dot(heartbeat.locationPermissionGranted)} ${heartbeat.locationPermissionGranted ? '已授予' : '未授予'}</span></div>
            <div class="detail-row"><span class="detail-label">定位服务</span><span class="detail-value">${dot(heartbeat.locationServiceEnabled)} ${heartbeat.locationServiceEnabled ? '已开启' : '未开启'}</span></div>
            <div class="detail-row"><span class="detail-label">通知权限</span><span class="detail-value">${dot(heartbeat.notificationEnabled)} ${heartbeat.notificationEnabled ? '已开启' : '未开启'}</span></div>
            <div class="detail-row"><span class="detail-label">电池优化</span><span class="detail-value">${dot(heartbeat.ignoreBatteryOptimization)} ${heartbeat.ignoreBatteryOptimization ? '已忽略（推荐）' : '未忽略'}</span></div>
            <div class="detail-row"><span class="detail-label">后台服务</span><span class="detail-value">${dot(heartbeat.appMonitorRunning)} ${heartbeat.appMonitorRunning ? '运行中' : '未运行'}</span></div>
        </div></div>`;
        html += '</div>';

        document.getElementById('detail-app').innerHTML = html;
        window.scrollTo(0, 0);
    }
    function handleDetailOverlayClick() {
        if (Date.now() - detailOpenedAt < 350) return;
        goBack();
    }

    function goBack() {
        document.getElementById('detail-container').classList.remove('active');
        currentHeartbeatDetail = null;

        if (currentTab === 'list') {
            document.getElementById('list-container').classList.add('active');
            currentView = 'list';
            renderList();
        } else if (currentTab === 'history') {
            document.getElementById('history-container').classList.add('active');
            currentView = 'list';
            renderHistory();
        } else if (currentTab === 'events') {
            document.getElementById('events-container').classList.add('active');
            currentView = 'list';
            renderEvents();
        } else {
            document.getElementById('map-container').classList.add('active');
            currentView = 'list';
            triggerMapInitSequence();
        }
    }

    async function editRemark(deviceId) {
        const current = document.getElementById('detail-remark').textContent;
        const remark = prompt('设备备注', current === '点击添加备注' ? '' : current);
        if (remark === null) return;
        try {
            const res = await fetch(`${API}/device/${deviceId}/remark`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ remark })
            });
            const result = await res.json();
            if (result.success) {
                document.getElementById('detail-remark').textContent = remark || '点击添加备注';
            }
        } catch (e) {
            alert('保存备注失败');
        }
    }

    async function deleteDevice(deviceId, name) {
        if (!confirm(`确认删除设备「${name}」及其所有上报记录？\n\n此操作不可撤销。`)) return;
        try {
            const res = await fetch(`${API}/device/${encodeURIComponent(deviceId)}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) {
                if (currentView === 'detail') goBack();
                else if (currentTab === 'list') await renderList();
                else if (currentTab === 'history') await renderHistory();
                else if (currentTab === 'events') await renderEvents();
                else if (currentTab === 'map') await initMap();
            } else {
                alert('删除失败：' + (result.error || '未知错误'));
            }
        } catch (e) {
            alert('删除失败，请重试');
        }
    }

    async function refresh() {
        if (currentTab === 'list' && currentView === 'list') await renderList();
        else if (currentTab === 'history' && currentView === 'list') await renderHistory();
        else if (currentTab === 'events' && currentView === 'list') await renderEvents();
        else if (currentTab === 'map' && currentView === 'list') await initMap();
        else if (currentTab === 'history' && currentView === 'detail' && currentHeartbeatDetail) showHeartbeatDetail(currentHeartbeatDetail.heartbeat, currentHeartbeatDetail.previousHeartbeat);
        else if (currentView === 'detail' && currentDeviceId) await showDetail(currentDeviceId);
    }

    window.addEventListener('resize', function() {
        if (currentTab === 'history' && currentView === 'list') renderHistoryChart(historyState.records || []);
        else if (historyState.chart) historyState.chart.resize();
    });

    renderList();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安心守护</title>
    <script>
        window._AMapSecurityConfig = { securityJsCode: '075c18b3e14a1b29ffb564700deed200' }
    </script>
    <script src="https://webapi.amap.com/maps?v=2.0&key=6ab1df99588a9c4bf3c06319d53d5369&plugin=AMap.Scale,AMap.ToolBar,AMap.Geocoder"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }

        .tab-bar { display: flex; background: white; border-bottom: 1px solid #eee; position: sticky; top: 0; z-index: 99; }
        .tab { flex: 1; padding: 14px; text-align: center; font-size: 14px; font-weight: 500; color: #666; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab.active { color: #667eea; border-bottom-color: #667eea; }
        .tab:hover { background: #f8f8f8; }

        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        @media (min-width: 900px) { .container { max-width: 960px; } }
        @media (min-width: 1200px) { .container { max-width: 1100px; } }

        .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
        .stat-card { background: white; border-radius: 12px; padding: 16px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .stat-num { font-size: 28px; font-weight: 700; }
        .stat-num.green { color: #4CAF50; }
        .stat-num.red { color: #f44336; }
        .stat-num.orange { color: #FF9800; }
        .stat-label { font-size: 12px; color: #999; margin-top: 4px; }

        .device-card { background: white; border-radius: 16px; margin-bottom: 16px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .device-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .device-header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; }
        .device-name { font-size: 18px; font-weight: 600; }
        .device-time { font-size: 12px; color: #999; }
        .device-body { padding: 16px 20px; }

        .history-card { background: white; border-radius: 12px; margin-bottom: 8px; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
        .history-row { display: flex; align-items: center; padding: 12px 16px; gap: 12px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: background 0.15s; }
        .history-row:last-child { border-bottom: none; }
        .history-row:hover { background: #f8f8ff; }
        .history-name { font-size: 14px; font-weight: 600; min-width: 60px; white-space: nowrap; }
        .history-time { font-size: 12px; color: #999; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .history-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
        .history-badge.online { background: #E8F5E9; color: #2E7D32; }
        .history-badge.offline { background: #FFEBEE; color: #C62828; }
        .history-badge.charging { background: #FFF3E0; color: #E65100; }

        .status-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 900px) { .status-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1200px) { .status-grid { grid-template-columns: repeat(5, 1fr); } }

        .status-item { display: flex; align-items: center; gap: 10px; }
        .status-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .status-text { flex: 1; min-width: 0; }
        .status-label { font-size: 11px; color: #999; }
        .status-value { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .battery-bar { height: 6px; background: #e0e0e0; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .battery-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
        .battery-fill.high { background: linear-gradient(90deg, #4CAF50, #8BC34A); }
        .battery-fill.medium { background: linear-gradient(90deg, #FF9800, #FFC107); }
        .battery-fill.low { background: linear-gradient(90deg, #f44336, #FF5722); }

        .alert-banner { background: linear-gradient(135deg, #fff3e0, #ffe0b2); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .alert-banner.danger { background: linear-gradient(135deg, #ffebee, #ffcdd2); }
        .alert-icon { font-size: 20px; }
        .alert-text { font-size: 13px; color: #e65100; flex: 1; }
        .alert-banner.danger .alert-text { color: #c62828; }

        .detail-columns { display: flex; flex-direction: column; gap: 12px; }
        @media (min-width: 900px) { .detail-columns { flex-direction: row; flex-wrap: wrap; } .detail-columns > .detail-section { flex: 1 1 calc(50% - 6px); min-width: 0; } }

        .detail-section { background: white; border-radius: 12px; margin-bottom: 0; overflow: hidden; box-shadow: 0 1px 6px rgba(0,0,0,0.05); }
        .section-title { padding: 14px 16px; font-size: 15px; font-weight: 600; color: #555; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 8px; }
        .section-body { padding: 4px 0; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #f8f8f8; }
        .detail-row:last-child { border-bottom: none; }
        .detail-label { font-size: 14px; color: #888; }
        .detail-value { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .dot.green { background: #4CAF50; }
        .dot.red { background: #f44336; }
        .dot.orange { background: #FF9800; }

        .volume-bar { display: flex; gap: 2px; align-items: flex-end; height: 20px; }
        .volume-seg { width: 4px; background: #e0e0e0; border-radius: 2px; }
        .volume-seg.active { background: #667eea; }

        .timeline { padding: 12px 16px; }
        .timeline-item { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
        .timeline-item:not(:last-child)::before { content: ''; position: absolute; left: 11px; top: 24px; bottom: 0; width: 2px; background: #e0e0e0; }
        .timeline-dot { width: 24px; height: 24px; border-radius: 50%; background: #667eea; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .timeline-dot .icon { font-size: 12px; color: white; }
        .timeline-content { flex: 1; }
        .timeline-title { font-size: 14px; font-weight: 500; }
        .timeline-time { font-size: 12px; color: #999; margin-top: 2px; }
        .timeline-detail { font-size: 12px; color: #666; margin-top: 4px; background: #f5f5f5; padding: 6px 10px; border-radius: 6px; }

        .empty { text-align: center; padding: 60px 20px; color: #999; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-text { font-size: 16px; font-weight: 500; margin-bottom: 8px; color: #666; }
        .empty-hint { font-size: 13px; }

        .detail-delete-btn { width: 100%; padding: 14px; background: #fff; color: #f44336; font-size: 15px; font-weight: 600; border: 1px solid #ffcdd2; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-top: 12px; -webkit-tap-highlight-color: transparent; }
        .detail-delete-btn:hover { background: #ffebee; border-color: #f44336; }

        #refresh-btn { position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; font-size: 20px; cursor: pointer; box-shadow: 0 4px 16px rgba(102,126,234,0.4); transition: transform 0.2s; z-index: 100; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        #refresh-btn:hover { transform: scale(1.1); }

        .loading { text-align: center; padding: 40px; color: #999; }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid #e0e0e0; border-top-color: #667eea; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 地图页样式 */
        #list-container { display: none; }
        #list-container.active { display: block; }
        #history-container { display: none; }
        #history-container.active { display: block; }
        #map-container { display: none; }
        #map-container.active { display: block; }
        #detail-container { display: none; }
        #detail-container.active {
            display: flex; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200;
            align-items: stretch; justify-content: flex-end;
        }
        .detail-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            animation: fadeIn 0.2s ease;
        }
        .detail-drawer {
            position: relative; width: 90%; max-width: 560px;
            background: #f0f2f5; overflow-y: auto; padding: 16px;
            box-shadow: -4px 0 24px rgba(0,0,0,0.15);
            animation: slideInRight 0.3s ease;
        }
        .detail-close {
            position: sticky; top: 0; z-index: 10;
            display: flex; justify-content: flex-end; padding: 8px 0;
        }
        .detail-close-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: white; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
            color: #666; transition: background 0.2s;
            -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
        }
        .detail-close-btn:hover { background: #f5f5f5; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }

        .map-layout { display: flex; flex-direction: column; gap: 12px; }
        .map-wrap { position: relative; height: clamp(280px, 45vh, 380px); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); min-width: 0; }
        #map { width: 100%; height: 100%; }
        #map { width: 100%; height: 100%; }

        .map-empty { text-align: center; padding: 80px 20px; color: #999; }
        .map-location-list { display: grid; gap: 8px; }
        .map-location-item { width: 100%; border: 1px solid #e8eaf6; background: white; border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; transition: all 0.2s; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
        .map-location-item:hover { border-color: #667eea; box-shadow: 0 4px 16px rgba(102,126,234,0.12); transform: translateY(-1px); }
        .map-location-item.active { border-color: #667eea; background: #f5f7ff; }
        .map-location-name { display: block; font-size: 13px; font-weight: 600; color: #333; }
        .map-location-text { display: block; margin-top: 3px; font-size: 12px; color: #555; line-height: 1.45; }
        .map-location-empty { background: white; border-radius: 12px; padding: 16px; color: #999; font-size: 13px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
        .map-list-toggle { display: none; position: fixed; z-index: 160; width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white; border: none; box-shadow: 0 4px 16px rgba(102,126,234,0.4);
            font-size: 20px; cursor: pointer; align-items: center; justify-content: center;
            transition: transform 0.2s;
            -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        }
        .map-list-toggle.visible { display: flex; }
        .map-list-toggle:active { transform: scale(0.9); }

        /* 移动端：地图占满剩余空间，设备列表浮动可收起 */
        @media (max-width: 899px) {
            #map-container.active { position: fixed; top: 48px; left: 0; right: 0; bottom: 0; z-index: 50; padding: 0 !important; }
            #map-container.active .container { padding: 0 !important; max-width: 100% !important; }
            .map-layout {
                display: block; position: relative;
                width: 100%; height: 100vh; height: 100dvh;
            }
            .map-wrap {
                width: 100%; height: 100%;
                border-radius: 0; box-shadow: none;
            }
            .map-list-toggle.visible {
                bottom: 80px; right: 24px;
            }
            #refresh-btn { bottom: 24px; }
            .map-location-list {
                position: fixed; bottom: 0; left: 0; right: 0; z-index: 210;
                max-height: 50vh; overflow-y: auto;
                background: white; border-radius: 16px 16px 0 0;
                padding: 8px 16px 16px;
                box-shadow: 0 -2px 16px rgba(0,0,0,0.12);
                transform: translateY(0);
                transition: transform 0.3s ease;
            }
            /* 收起时：只露出顶部拖拽条（约24px的圆角区域） */
            .map-location-list.collapsed { transform: translateY(calc(100% - 24px)); }
            .map-location-list::before {
                content: ''; display: block; width: 36px; height: 4px;
                background: #ccc; border-radius: 2px; margin: 8px auto 10px;
                flex-shrink: 0;
            }
            .map-location-list:not(.collapsed)::before {
                margin-bottom: 10px;
            }
        }
        @media (min-width: 900px) {
            .map-layout { display: grid; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); align-items: stretch; }
            .map-wrap { height: calc(100vh - 170px); min-height: 500px; }
            .map-location-list { max-height: calc(100vh - 170px); overflow-y: auto; align-content: start; padding-right: 4px; }
            .map-list-toggle { display: none !important; }
        }

        /* Leaflet 自定义弹窗 */
        .amap-info-content { border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); font-family: inherit; }
        .popup-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
        .popup-status { font-size: 13px; color: #666; line-height: 1.8; }
        .popup-status .online { color: #4CAF50; font-weight: 500; }
        .popup-status .offline { color: #f44336; font-weight: 500; }
    </style>
</head>
<body>
    <div class="tab-bar" id="tab-bar">
        <div class="tab active" onclick="switchTab('list')">📋 设备列表</div>
        <div class="tab" onclick="switchTab('history')">📜 上报记录</div>
        <div class="tab" onclick="switchTab('map')">🗺️ 设备地图</div>
    </div>

    <div id="list-container" class="active">
        <div class="container" id="app">
            <div class="loading"><div class="spinner"></div><div style="margin-top:12px">加载中...</div></div>
        </div>
    </div>

    <div id="history-container">
        <div class="container" id="history-app">
            <div class="loading"><div class="spinner"></div><div style="margin-top:12px">加载中...</div></div>
        </div>
    </div>

    <div id="map-container">
        <div class="container" style="padding:16px;max-width:1400px;">
            <div class="map-layout">
                <div id="map-location-list" class="map-location-list">
                    <div class="map-location-empty">正在加载设备位置...</div>
                </div>
                <div class="map-wrap">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <button class="map-list-toggle" id="map-list-toggle" onclick="toggleMapList()" title="设备列表">📋</button>

    <div id="detail-container">
        <div class="detail-overlay" onclick="goBack()"></div>
        <div class="detail-drawer">
            <div class="detail-close">
                <button class="detail-close-btn" onclick="goBack()" title="关闭">✕</button>
            </div>
            <div id="detail-app"></div>
        </div>
    </div>

    <button id="refresh-btn" onclick="refresh()" title="刷新">🔄</button>

    <script>
    const API = window.location.origin + '/api';
    let currentView = 'list';
    let currentDeviceId = null;
    let currentTab = 'list';
    let map = null;
    let markers = [];
    let currentMapPoints = [];
    let activeMapDeviceId = null;
    let mapInfoWindow = null;
    let geocoderInstance = null;
    let mapRenderVersion = 0;
    let mapInitSequenceId = 0;
    let mapControlsReady = false;
    const mapPointLookup = new Map();
    const locationTextCache = new Map();

    async function fetchJSON(url) { const res = await fetch(url); return res.json(); }

    function formatTime(iso) {
        if (!iso) return '未知';
        const diff = Date.now() - new Date(iso).getTime();
        const m = Math.floor(diff / 60000);
        if (m < 1) return '刚刚'; if (m < 60) return m + '分钟前';
        const h = Math.floor(m / 60); if (h < 24) return h + '小时前';
        return Math.floor(h / 24) + '天前';
    }

    function fmt(iso) { return iso ? new Date(iso).toLocaleString('zh-CN') : '未知'; }
    function batColor(p) { return p > 50 ? '#4CAF50' : p > 20 ? '#FF9800' : '#f44336'; }
    function batClass(p) { return p > 50 ? 'high' : p > 20 ? 'medium' : 'low'; }

    function volumeBar(cur, max) {
        const n = 5, a = Math.round((cur / max) * n);
        let h = '<div class="volume-bar">';
        for (let i = 0; i < n; i++) h += `<div class="volume-seg ${i < a ? 'active' : ''}" style="height:${6+i*3}px"></div>`;
        return h + '</div>';
    }

    function getAlerts(d) {
        const a = [];
        if (!d.appMonitorRunning) a.push({t:'后台服务未运行',l:'w'});
        if (!d.locationPermissionGranted) a.push({t:'定位权限未授予',l:'w'});
        if (!d.ignoreBatteryOptimization) a.push({t:'电池优化未忽略',l:'w'});
        if (d.ringerMode === 'SILENT' || d.ringVolume === 0) a.push({t:'铃声已关闭，可能听不到电话',l:'w'});
        if (d.mediaVolume === 0) a.push({t:'媒体音量为0，微信电话听不到',l:'w'});
        if (d.batteryPercent <= 15 && !d.isCharging) a.push({t:'电量过低，可能即将关机',l:'d'});
        if (d.networkStatus === 'NONE' && !d.mobileDataEnabled) a.push({t:'当前无网络连接',l:'d'});
        if (d.airplaneMode) a.push({t:'飞行模式已开启',l:'d'});
        if (d.powerSaveMode) a.push({t:'省电模式已开启',l:'w'});
        return a;
    }

    function evtIcon(t) {
        return {'AIRPLANE_MODE_CHANGED':'✈️','RINGER_MODE_CHANGED':'🔔','BATTERY_LOW':'🪫','BATTERY_OKAY':'🔋','CHARGING_STATE_CHANGED':'🔌','WIFI_STATE_CHANGED':'📶','WIFI_CONNECTION_CHANGED':'📶','LOCATION_SERVICE_CHANGED':'📍','BOOT_COMPLETED':'🔄','NETWORK_CHANGED':'🌐','NETWORK_RECOVERED':'✅'}[t]||'📌';
    }

    function dot(ok) { return `<span class="dot ${ok?'green':'red'}"></span>`; }
    function hasValidCoordinates(data) {
        const lat = Number(data && data.latitude);
        const lng = Number(data && data.longitude);
        return Number.isFinite(lat) && Number.isFinite(lng);
    }
    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, function(ch) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch];
        });
    }
    function getCoordinateKey(lat, lng) { return `${lat.toFixed(5)},${lng.toFixed(5)}`; }
    function isOverseasCoordinate(lat, lng) {
        return lng < 73 || lng > 136 || lat < 3 || lat > 54;
    }
    function nextPaint() {
        return new Promise(function(resolve) {
            requestAnimationFrame(function() {
                requestAnimationFrame(resolve);
            });
        });
    }
    async function waitForMapContainerReady(maxAttempts) {
        const attempts = maxAttempts || 20;
        const mapContainer = document.getElementById('map-container');
        const mapElement = document.getElementById('map');
        for (let i = 0; i < attempts; i++) {
            await nextPaint();
            if (currentTab !== 'map' || currentView === 'detail') return false;
            if (mapContainer.classList.contains('active') && mapElement.offsetWidth > 0 && mapElement.offsetHeight > 0) return true;
        }
        return false;
    }
    function fitMapToMarkers() {
        if (!map) return;
        requestAnimationFrame(function() {
            requestAnimationFrame(function() {
                map.resize();
                if (markers.length > 0) map.setFitView(markers, false, [80, 80, 80, 80]);
            });
        });
        setTimeout(function() {
            if (!map || currentTab !== 'map' || currentView === 'detail') return;
            map.resize();
            if (markers.length > 0) map.setFitView(markers, false, [80, 80, 80, 80]);
        }, 260);
    }
    function triggerMapInitSequence() {
        const sequenceId = ++mapInitSequenceId;
        initMap();
        [300, 900].forEach(function(delay) {
            setTimeout(function() {
                if (sequenceId !== mapInitSequenceId) return;
                if (currentTab !== 'map' || currentView === 'detail') return;
                initMap();
            }, delay);
        });
    }
    function getGeocoder() {
        if (geocoderInstance) return Promise.resolve(geocoderInstance);
        return new Promise(function(resolve) {
            AMap.plugin('AMap.Geocoder', function() {
                geocoderInstance = new AMap.Geocoder({ radius: 1000, extensions: 'base' });
                resolve(geocoderInstance);
            });
        });
    }
    function formatApproxLocation(regeocode) {
        if (!regeocode) return '位置解析失败';
        const comp = regeocode.addressComponent || {};
        const streetNumber = comp.streetNumber || {};
        const landmark = [streetNumber.street, streetNumber.number].filter(Boolean).join('');
        const prefix = [comp.city && comp.city !== comp.province ? comp.city : '', comp.district, comp.township].filter(Boolean).join('');
        return landmark ? `${prefix}${landmark}` : (regeocode.formattedAddress || prefix || '位置解析失败');
    }
    async function reverseGeocode(lat, lng) {
        const key = getCoordinateKey(lat, lng);
        if (locationTextCache.has(key)) return locationTextCache.get(key);
        if (isOverseasCoordinate(lat, lng)) {
            const text = '海外位置，暂不支持高德解析';
            locationTextCache.set(key, text);
            return text;
        }
        try {
            const geocoder = await getGeocoder();
            const text = await new Promise(function(resolve) {
                geocoder.getAddress([lng, lat], function(status, result) {
                    if (status === 'complete' && result && result.regeocode) resolve(formatApproxLocation(result.regeocode));
                    else resolve('位置解析失败');
                });
            });
            locationTextCache.set(key, text);
            return text;
        } catch (e) {
            return '位置解析失败';
        }
    }

    // WGS-84 → GCJ-02 坐标转换（高德地图专用，JSAPI 2.0）
    function convertToGCJ02(points) {
        return new Promise(function(resolve, reject) {
            if (!points.length) return resolve(points);
            var coords = [];
            for (var i = 0; i < points.length; i++) {
                coords.push([points[i].longitude, points[i].latitude]);
            }
            AMap.convertFrom(coords, 'gps', function(status, result) {
                if (status === 'complete' && result && result.locations) {
                    for (var i = 0; i < result.locations.length; i++) {
                        var loc = result.locations[i];
                        // 高德 2.0 返回 LngLat 对象，兼容 .lng/.lat 和 getLng()/getLat()
                        points[i].longitude = loc.lng !== undefined ? loc.lng : loc.getLng();
                        points[i].latitude = loc.lat !== undefined ? loc.lat : loc.getLat();
                    }
                }
                resolve(points);
            });
        });
    }

    async function initMap() {
        const isReady = await waitForMapContainerReady();
        if (!isReady) return;
        const version = ++mapRenderVersion;
        document.getElementById('map-location-list').innerHTML = '<div class="map-location-empty">正在加载设备位置...</div>';
        const devices = await fetchJSON(`${API}/devices`);
        const detailedDevices = await Promise.all(devices.map(async function(device) {
            const detail = await fetchJSON(`${API}/device/${device.deviceId}/latest`);
            return { device, detail };
        }));
        if (version !== mapRenderVersion) return;

        let points = detailedDevices.filter(function(item) {
            return hasValidCoordinates(item.detail);
        }).map(function(item) {
            return {
                device: item.device,
                detail: item.detail,
                latitude: Number(item.detail.latitude),
                longitude: Number(item.detail.longitude),
                locationText: ''
            };
        });

        // WGS-84 → GCJ-02 转换
        points = await convertToGCJ02(points);

        // 填充缓存
        points.forEach(function(p) {
            var key = getCoordinateKey(p.latitude, p.longitude);
            p.locationText = locationTextCache.get(key) || '';
        });

        if (points.length === 0) {
            currentMapPoints = [];
            activeMapDeviceId = null;
            mapPointLookup.clear();
            markers.forEach(function(m) { map && map.remove(m); });
            markers = [];
            if (mapInfoWindow) mapInfoWindow.close();
            renderMapLocationList([]);
            if (!map) {
                map = new AMap.Map('map', { zoom: 5, center: [116.4074, 39.9042], resizeEnable: true });
                ensureMapControls();
            } else {
                map.setZoomAndCenter(5, [116.4074, 39.9042]);
                ensureMapControls();
            }
            fitMapToMarkers();
            return;
        }

        // 首次创建地图
        if (!map) {
            map = new AMap.Map('map', {
                zoom: 14,
                center: [points[0].longitude, points[0].latitude],
                resizeEnable: true,
                zooms: [3, 20]
            });
        }
        ensureMapControls();

        // 清除旧标记
        markers.forEach(function(m) { map.remove(m); });
        markers = [];
        mapPointLookup.clear();

        // 添加标记
        for (var i = 0; i < points.length; i++) {
            (function(p) {
                var color = p.device.isOnline ? '#4CAF50' : '#f44336';
                var marker = new AMap.Marker({
                    position: new AMap.LngLat(p.longitude, p.latitude),
                    map: map,
                    title: p.device.elderName,
                    content: '<div style="width:32px;height:32px;background:' + color + ';border-radius:50%;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-size:16px;">📱</div>',
                    offset: new AMap.Pixel(-16, -16)
                });

                var infoContent = '<div style="padding:8px;font-family:sans-serif;min-width:150px;">' +
                    '<b>' + escapeHTML(p.device.elderName || p.device.deviceId) + '</b><br>' +
                    '位置: ' + escapeHTML(p.locationText || '正在解析位置...') + '<br>' +
                    '电量: ' + p.detail.batteryPercent + '%<br>' +
                    '网络: ' + p.detail.networkStatus + '<br>' +
                    '最后上报: ' + formatTime(p.device.lastOnline) + '</div>';
                p.infoContent = infoContent;
                p.marker = marker;
                mapPointLookup.set(p.device.deviceId, p);

                marker.on('click', function() {
                    activeMapDeviceId = p.device.deviceId;
                    renderMapLocationList(currentMapPoints);
                    openMapInfoWindow(p);
                });

                marker.on('dblclick', function() {
                    focusMapDevice(p.device.deviceId);
                });

                markers.push(marker);
            })(points[i]);
        }

        currentMapPoints = points;
        if (activeMapDeviceId && !mapPointLookup.has(activeMapDeviceId)) activeMapDeviceId = null;
        renderMapLocationList(currentMapPoints);
        fitMapToMarkers();

        for (const point of currentMapPoints) {
            if (point.locationText) continue;
            reverseGeocode(point.latitude, point.longitude).then(function(locationText) {
                if (version !== mapRenderVersion) return;
                point.locationText = locationText;
                point.infoContent = '<div style="padding:8px;font-family:sans-serif;min-width:150px;">' +
                    '<b>' + escapeHTML(point.device.elderName || point.device.deviceId) + '</b><br>' +
                    '位置: ' + escapeHTML(point.locationText || '位置解析失败') + '<br>' +
                    '电量: ' + point.detail.batteryPercent + '%<br>' +
                    '网络: ' + point.detail.networkStatus + '<br>' +
                    '最后上报: ' + formatTime(point.device.lastOnline) + '</div>';
                renderMapLocationList(currentMapPoints);
                if (activeMapDeviceId === point.device.deviceId) openMapInfoWindow(point);
            });
        }
    }

        if (currentTab === 'list') {
            document.getElementById('list-container').classList.add('active');
            currentView = 'list';
            renderList();
        } else if (currentTab === 'history') {
            document.getElementById('history-container').classList.add('active');
            currentView = 'list';
            renderHistory();
        } else {
            document.getElementById('map-container').classList.add('active');
            currentView = 'list';
            triggerMapInitSequence();
        }
    }

    async function editRemark(deviceId) {
        const current = document.getElementById('detail-remark').textContent;
        const remark = prompt('设备备注', current === '点击添加备注' ? '' : current);
        if (remark === null) return;
        try {
            const res = await fetch(`${API}/device/${deviceId}/remark`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ remark })
            });
            const result = await res.json();
            if (result.success) {
                document.getElementById('detail-remark').textContent = remark || '点击添加备注';
            }
        } catch (e) {
            alert('保存备注失败');
        }
    }

    async function deleteDevice(deviceId, name) {
        if (!confirm(`确认删除设备「${name}」及其所有上报记录？\n\n此操作不可撤销。`)) return;
        try {
            const res = await fetch(`${API}/device/${encodeURIComponent(deviceId)}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) {
                if (currentView === 'detail') goBack();
                else if (currentTab === 'list') await renderList();
                else if (currentTab === 'history') await renderHistory();
                else if (currentTab === 'map') await initMap();
            } else {
                alert('删除失败：' + (result.error || '未知错误'));
            }
        } catch (e) {
            alert('删除失败，请重试');
        }
    }

    async function refresh() {
        if (currentTab === 'list' && currentView === 'list') await renderList();
        else if (currentTab === 'history' && currentView === 'list') await renderHistory();
        else if (currentTab === 'map' && currentView === 'list') await initMap();
        else if (currentView === 'detail' && currentDeviceId) await showDetail(currentDeviceId);
    }

    renderList();
    </script>
</body>
</html>
